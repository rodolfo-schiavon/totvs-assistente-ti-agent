name: Publish GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: v2.7.5-totvs.1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend, ai-agent]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/totvs-juridico-${{ matrix.component }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/totvs-juridico-${{ matrix.component }}:latest

      - name: Set package visibility public
        continue-on-error: true
        run: |
          PKG="totvs-juridico-${{ matrix.component }}"
          gh api --method POST \
            "/repos/${{ github.repository }}/packages/container/${PKG}/visibility" \
            -f visibility=public || \
          gh api --method PATCH \
            "/user/packages/container/${PKG}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
