name: CD

on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/ci.yml

  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      gitops_branch: ${{ steps.version.outputs.gitops_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < .github/image-version)"
          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "Invalid .github/image-version: '$VERSION'"
            exit 1
          fi
          BASE_TAG="v0.1.0-totvs.${VERSION}"
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            IMAGE_TAG="${BASE_TAG}-dev"
            GITOPS_BRANCH="develop"
          else
            IMAGE_TAG="${BASE_TAG}"
            GITOPS_BRANCH="main"
          fi
          NEXT_VERSION=$((VERSION + 1))
          echo "$NEXT_VERSION" > .github/image-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/image-version
          git commit -m "chore: bump image-version to ${NEXT_VERSION} [skip ci]"
          git push
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "gitops_branch=${GITOPS_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_TAG} (next counter ${NEXT_VERSION})"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          for component in frontend backend ai-agent; do
            docker buildx build \
              --push \
              --tag "ghcr.io/${{ github.repository_owner }}/totvs-assistente-ti-${component}:${IMAGE_TAG}" \
              --tag "ghcr.io/${{ github.repository_owner }}/totvs-assistente-ti-${component}:latest" \
              "./${component}"
          done

      - name: Set package visibility public
        continue-on-error: true
        run: |
          for component in frontend backend ai-agent; do
            PKG="totvs-assistente-ti-${component}"
            gh api --method POST \
              "/repos/${{ github.repository }}/packages/container/${PKG}/visibility" \
              -f visibility=public || \
            gh api --method PATCH \
              "/user/packages/container/${PKG}" \
              -f visibility=public || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-gitops:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger platform-lab GitOps bump
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_LAB_PAT }}
          repository: rodolfo-schiavon/totvs-ai-agent-platform-lab
          event-type: assistente-ti-image-published
          client-payload: >-
            {
              "tag": "${{ needs.publish.outputs.image_tag }}",
              "branch": "${{ needs.publish.outputs.gitops_branch }}",
              "components": ["frontend", "backend", "ai-agent"]
            }
