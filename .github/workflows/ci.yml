name: CI

on:
  workflow_call:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_ai
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legal_ai
      API_SECRET: ci-test-api-secret
      AUTH_SECRET: ci-auth-secret-with-enough-length-32
      AGENT_SERVICE_SECRET: ci-agent-secret
      CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-32-characters!!
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
      FRONTEND_URL: http://localhost:3000
      PORT: 8000
      RUN_PRISMA_DB_PUSH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx prisma db push
      - run: npm run seed
      - run: npm run build
      - run: npx tsx src/knowledge/ingestion.test.ts
      - run: npx tsx src/knowledge/openai-pdf.test.ts

  ai-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      AUTH_SECRET: ci-auth-secret-with-enough-length-32
      API_URL: http://localhost:8000
      AI_AGENT_URL: http://localhost:8100
      API_SECRET: ci-test-api-secret
      NEXT_PUBLIC_APP_NAME: Legal AI Workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, ai-agent, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_ai
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legal_ai
      API_SECRET: ci-test-api-secret
      AUTH_SECRET: ci-auth-secret-with-enough-length-32
      AGENT_SERVICE_SECRET: ci-agent-secret
      CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-32-characters!!
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
      FRONTEND_URL: http://localhost:3000
      PORT: "8010"
      RUN_PRISMA_DB_PUSH: "true"
      API_URL: http://localhost:8010
      AI_AGENT_URL: http://localhost:8100
      NEXT_PUBLIC_APP_NAME: Legal AI Workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: npm install
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Install ai-agent
        working-directory: ai-agent
        run: pip install -r requirements.txt
      - name: DB push and seed
        working-directory: backend
        run: npx prisma db push && npm run seed
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
